name: Quality checks

on:
  push:
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run source-level smoke tests
        run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Start local test server
        run: |
          python3 -m http.server 4173 > /tmp/chicago-block-server.log 2>&1 &
          echo $! > /tmp/chicago-block-server.pid
      - name: Run desktop and mobile browser checks
        run: npm run test:browser
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chicago-block-v4-3-browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
