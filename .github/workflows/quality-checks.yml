name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download licensed V4.6 model assets
        run: npm run assets:download
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run source-level smoke tests
        run: npm test

  browser:
    if: github.head_ref != 'v4-4-geographic-data-foundation-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download licensed V4.6 model assets
        run: npm run assets:download
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium browser binary
        run: npx playwright install chromium
      - name: Start local test server
        run: |
          python3 -m http.server 4173 > /tmp/chicago-block-server.log 2>&1 &
          echo $! > /tmp/chicago-block-server.pid
      - name: Run desktop and mobile browser checks
        run: npm run test:browser
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chicago-block-v4-6-browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
