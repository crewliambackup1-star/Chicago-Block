name: Publish V4.6 model assets

on:
  push:
    branches:
      - main
    paths:
      - model-assets.js
      - scripts/download-model-assets.mjs
      - .github/workflows/publish-model-assets.yml

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and verify CC0 GLB files
        run: npm run assets:download
      - name: Commit model binaries for GitHub Pages
        run: |
          git add assets/models/
          if git diff --cached --quiet; then
            echo "Model assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish V4.6 human and vehicle model assets"
          git push origin HEAD:main
      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/pages/builds"
